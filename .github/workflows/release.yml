name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APP_PATH: build/DerivedData/Build/Products/Release/DuoLapse.app
      SIGNING_IDENTITY_NAME: DuoLapse Self-Signed
    steps:
      - uses: actions/checkout@v5

      - name: Read version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must look like v1.2.3"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Check release secrets
        env:
          SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.SIGNING_CERTIFICATE_P12_BASE64 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          missing=()
          [[ -n "$SIGNING_CERTIFICATE_P12_BASE64" ]] || missing+=("secret SIGNING_CERTIFICATE_P12_BASE64")
          [[ -n "$SPARKLE_PRIVATE_KEY" ]] || missing+=("secret SPARKLE_PRIVATE_KEY")
          [[ -n "$SPARKLE_PUBLIC_ED_KEY" ]] || missing+=("variable SPARKLE_PUBLIC_ED_KEY")
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing %s. See RELEASING.md.\n' "${missing[@]}"
            exit 1
          fi

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build release app
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          xcodebuild build \
            -project DuoLapse.xcodeproj \
            -scheme DuoLapse \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            SPARKLE_PUBLIC_ED_KEY="$SPARKLE_PUBLIC_ED_KEY" \
            CODE_SIGNING_ALLOWED=NO

      - name: Import signing identity
        env:
          SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.SIGNING_CERTIFICATE_P12_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          certificate="$RUNNER_TEMP/signing.p12"
          echo "$SIGNING_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$certificate"
          identity_hash="$(security find-identity -p codesigning "$keychain" | awk -v name="$SIGNING_IDENTITY_NAME" 'index($0, name) { print $2; exit }')"
          if [[ -z "$identity_hash" ]]; then
            echo "::error::No identity named $SIGNING_IDENTITY_NAME in the imported certificate"
            exit 1
          fi
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "SIGNING_IDENTITY=$identity_hash" >> "$GITHUB_ENV"

      - name: Sign app
        run: |
          sign() {
            codesign --force --options runtime --timestamp=none \
              --keychain "$SIGNING_KEYCHAIN" --sign "$SIGNING_IDENTITY" "$@"
          }
          sparkle="$APP_PATH/Contents/Frameworks/Sparkle.framework"
          if [[ -d "$sparkle" ]]; then
            for component in XPCServices/Installer.xpc Autoupdate Updater.app; do
              if [[ -e "$sparkle/Versions/B/$component" ]]; then
                sign "$sparkle/Versions/B/$component"
              fi
            done
            if [[ -e "$sparkle/Versions/B/XPCServices/Downloader.xpc" ]]; then
              sign --preserve-metadata=entitlements "$sparkle/Versions/B/XPCServices/Downloader.xpc"
            fi
            sign "$sparkle"
          fi
          sign --entitlements DuoLapse/DuoLapse.entitlements "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --display --requirements - "$APP_PATH"

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" build/DuoLapse.zip
          shasum -a 256 build/DuoLapse.zip

      - name: Sign update and write appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          sign_update="$(find build/DerivedData -type f -name sign_update -path '*artifacts*' | head -n 1)"
          if [[ -z "$sign_update" ]]; then
            echo "::error::Sparkle's sign_update tool wasn't found in the resolved package artifacts"
            exit 1
          fi
          key_file="$RUNNER_TEMP/sparkle-private-key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$key_file"
          signature="$("$sign_update" --ed-key-file "$key_file" build/DuoLapse.zip)"
          rm "$key_file"
          repository_url="https://github.com/${GITHUB_REPOSITORY}"
          publication_date="$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')"
          cat > build/appcast.xml <<APPCAST
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>DuoLapse</title>
              <link>${repository_url}</link>
              <item>
                <title>DuoLapse ${VERSION}</title>
                <pubDate>${publication_date}</pubDate>
                <sparkle:version>${BUILD_NUMBER}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>26.0</sparkle:minimumSystemVersion>
                <sparkle:releaseNotesLink>${repository_url}/releases/tag/${GITHUB_REF_NAME}</sparkle:releaseNotesLink>
                <enclosure url="${repository_url}/releases/download/${GITHUB_REF_NAME}/DuoLapse.zip" ${signature} type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          APPCAST
          xmllint --noout build/appcast.xml

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/DuoLapse.zip build/appcast.xml \
            --title "DuoLapse $VERSION" \
            --generate-notes

      - name: Remove signing keychain
        if: always()
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN"
          fi
